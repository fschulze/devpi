{# Displays links to the previous and next page in the TOCtree order. #}
<div class="prev-next-area">
    <div class="col-sm-12 d-lg-none toc-container">
        <a
            class="toc-text"
            href="{{ pathto(root_doc) }}"
            aria-label="{{ _('Table of Contents') }}"
        >
            Table of Contents
        </a>
    </div>
    {%- if prev %}
    <a
        class="col-sm-12 col-lg-5 left-prev"
        href="{{ prev.link|e }}"
        title="{{ _('previous page') }}"
    >
        <i class="fa-solid fa-angle-left"></i>
        <div class="prev-next-info">
            <p class="prev-next-subtitle">{{ _("previous") }}</p>
            <p class="prev-next-title">{{ prev_title or prev.title }}</p>
        </div>
    </a>
    {%- else %}
    <a class="col-sm-12 col-lg-5 left-prev" title="{{ _('previous page') }}">
        <div class="prev-next-info"></div>
    </a>
    {%- endif %}
    <div class="d-none d-lg-block col-lg-2 toc-container">
        <a
            class="toc-text"
            href="{{ pathto(root_doc) }}"
            aria-label="{{ _('Table of Contents') }}"
        >
            Table of Contents
        </a>
    </div>
    {%- if next %}
    <a
        class="col-sm-12 col-lg-5 right-next"
        href="{{ next.link|e }}"
        title="{{ _('next page') }}"
    >
        <div class="prev-next-info">
            <p class="prev-next-subtitle">{{ _("next") }}</p>
            <p class="prev-next-title">{{ next_title or next.title }}</p>
        </div>
        <i class="fa-solid fa-angle-right"></i>
    </a>
    {%- else %}
    <a class="col-sm-12 col-lg-5 right-next" title="{{ _('next page') }}">
        <div class="prev-next-info"></div>
    </a>
    {%- endif %}
</div>
